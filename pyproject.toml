[project]
name = "dns-mcp"
version = "0.1.1"
description = "Model Context Protocol server for DNS, WHOIS, and IP geolocation lookups."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "r0bin2u", email = "halcyonage123@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "dns", "whois", "rdap", "ip-geolocation", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.0",
]

[project.urls]
Homepage = "https://github.com/r0bin2u/dns-mcp"
Repository = "https://github.com/r0bin2u/dns-mcp"
Issues = "https://github.com/r0bin2u/dns-mcp/issues"

[project.scripts]
dns-mcp = "dns_mcp:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
